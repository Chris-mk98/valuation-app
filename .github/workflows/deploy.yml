name: Deploy (App Runner)

# 수동 실행. GitHub 러너에서 이미지 빌드→ECR 푸시→App Runner 재배포.
# 필요 시크릿(Settings→Secrets and variables→Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
# 선택: ECR_REPO(기본 valuation-app), APPRUNNER_SERVICE(기본 valuation-app)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build, push, deploy
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPO: ${{ vars.ECR_REPO || 'valuation-app' }}
          SERVICE: ${{ vars.APPRUNNER_SERVICE || 'valuation-app' }}
        run: bash infra/deploy/deploy-ecr.sh
