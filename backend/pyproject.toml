[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valuation-backend"
version = "0.1.0"
description = "기업가치평가 웹앱 백엔드 — 전문가 판단을 구조화·기록하는 도구"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 외부 데이터 소스 라이브러리는 3단계(sources)에서 실제로 사용. 스켈레톤 빌드를 가볍게 유지.
sources = [
    "dart-fss>=0.4",
    "ecos-reader>=0.1",
    "finance-datareader>=0.9",
    "pykrx>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "vcrpy>=6.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: line-length는 formatter가 관리
# B008: FastAPI 의 Depends()/File() 기본인자 관용구는 의도된 패턴
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "vcr: 외부 API 카세트를 사용하는 통합 테스트 (네트워크 없이 재생)",
]
